# Adds the "mod: <name>" label to issues opened from the issue templates.
#
# The templates ask "Which mod?" with a dropdown of mod folder names. This reads the answer from the issue body
# and adds the matching "mod: <FolderName>" label, replacing any other "mod: " label if the answer was edited.
# The label has to exist already; if it doesn't, the run only logs a warning.

name: Label issues by mod

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const match = (context.payload.issue.body || '').match(/### Which mod\?\s*\n+([^\n]+)/);
            if (!match) return;
            const mod = match[1].trim();
            if (mod === '_No response_') return;

            const label = `mod: ${mod}`;
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            if (!labels.some(l => l.name === label)) {
              core.warning(`The label "${label}" doesn't exist, create it to label issues for ${mod}.`);
              return;
            }

            const current = context.payload.issue.labels.map(l => l.name);
            for (const old of current.filter(name => name.startsWith('mod: ') && name !== label)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: old });
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [label] });
            }
